name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.HOST }} "echo SSH connection successful"

      - name: Pull changes and deploy on remote server
        run: |
          ssh -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.HOST }} << 'EOF'
          cd ${{ secrets.DIRECTORY }}
          git fetch origin main
          git pull origin main
          git reset --hard origin/main
          docker compose down
          docker container prune -f
          docker image prune -f
          docker build -t spedart .
          docker compose up -d --build
          EOF

      - name: Verify deployment
        run: |
          ssh -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.HOST }} "docker ps --filter 'name=spedart-backend' --format '{{.Status}}'"

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.HOST }} << 'EOF'
          cd ${{ secrets.DIRECTORY }}
          docker compose down
          git fetch origin main
          git checkout HEAD~1
          docker container prune -f
          docker image prune -f
          docker build -t spedart .
          docker compose up -d --build
          EOF

      - name: Verify rollback
        run: |
          ssh -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.HOST }} "docker ps --filter 'name=spedart-backend' --format '{{.Status}}'"
